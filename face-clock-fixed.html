 '<div class="lg"><span>'+t('live')+'</span><button class="'+(cfg.live?'on':'')+'" data-a="live">'+(cfg.live?'ON':'OFF')+'</button></div>'+
 '<div class="lg"><span>'+t('sens')+'</span><span>'+[1,2,3].map(function(i){return '<button class="'+(cfg.s==i?'on':'')+'" data-a="sens" data-v="'+i+'">'+t('s'+i)+'</button>'}).join(' ')+'</span></div>'+
 '<div class="lg"><span></span><span>'+['العربية','Français','English'].map(function(n,i){return '<button class="'+(li==i?'on':'')+'" data-a="lang" data-v="'+i+'">'+n+'</button>'}).join(' ')+'</span></div>'+
 '<button class="sec" data-a="lo">'+t('out2')+'</button><button class="sec" data-a="close">'+t('close')+'</button>'}
async function enroll(id){$('#sh').classList.remove('on');var id0=++run,S=[],last=0;try{await begin()}catch(e){camOff();result(0,e.message);return}
 var t0=Date.now();say(t('look'));while(run==id0&&S.length<6&&Date.now()-t0<30000){await sleep(120);var d=await faceapi.detectSingleFace($('#v'),opt()).withFaceLandmarks().withFaceDescriptor();
  if(d&&d.detection.score>.7&&d.detection.box.width>$('#v').videoWidth*.25&&Date.now()-last>700){S.push(Array.from(d.descriptor));last=Date.now();say(S.length+'/6 · '+t('mv'),'ok')}await sleep(40)}
 if(run!=id0)return;camOff();if(S.length<6){result(0,t('no'));return}
 try{await api('/rest/v1/face_templates?on_conflict=worker_id',{m:'POST',h:UP,b:[{worker_id:+id,descriptors:S,updated_at:new Date().toISOString()}]});T[id]=S.map(function(x){return new Float32Array(x)});result(1,t('saved'),'','in')}catch(e){result(0,e.message)}}
document.addEventListener('click',async function(ev){var b=ev.target.closest('[data-a]');if(ev.target.id=='sh'){$('#sh').classList.remove('on');return}if(!b)return;var a=b.dataset.a,id=b.dataset.id;
 if(a=='login')login();else if(a=='scan')scan(b.dataset.m);else if(a=='stop'){camOff()}else if(a=='reload'){try{dataErr='';await data();panel()}catch(e){dataErr=e.message||String(e);panel()}}
 else if(a=='adm'){if(await askPw()){panel();$('#sh').classList.add('on')}}
 else if(a=='close')$('#sh').classList.remove('on');else if(a=='enr')enroll(id);
 else if(a=='fdel'){try{await api('/rest/v1/face_templates?worker_id=eq.'+id,{m:'DELETE',h:{Prefer:'return=minimal'}});delete T[id];panel()}catch(e){alert(e.message)}}
 else if(a=='live'){cfg.live=!cfg.live;ls('fc_live',cfg.live?'1':'0');panel()}else if(a=='sens'){cfg.s=+b.dataset.v;ls('fc_s',cfg.s);panel()}
 else if(a=='lang'){li=+b.dataset.v;ls('plan_lang',['ar','fr','en'][li]);txt();panel()}
 else if(a=='lo'){SB=null;ls('plan_sb','');T={};$('#sh').classList.remove('on');show()}});
$('#pw').addEventListener('keydown',function(e){if(e.key=='Enter')login()});
