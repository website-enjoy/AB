<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>planing</title>
<link rel="icon" type="image/jpeg" href="IMG_5330.jpeg">
<link rel="apple-touch-icon" href="IMG_5330.jpeg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f4f8;--sf:#fff;--sf2:#f6f7fb;--tx:#171a21;--mut:#6b7385;--bd:#e5e8f0;--pr:#4f46e5;--prs:#eef0ff;--ok:#059669;--oks:#e3f6ee;--bad:#e11d48;--bads:#fde8ed;--sh:0 1px 2px rgba(20,24,40,.05),0 6px 20px rgba(20,24,40,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--sf:#171a22;--sf2:#1d212b;--tx:#eef0f6;--mut:#98a1b3;--bd:#272c38;--pr:#8b85ff;--prs:#23244a;--ok:#34d399;--oks:#12332a;--bad:#fb7185;--bads:#3b1823;--sh:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0e1015;--sf:#171a22;--sf2:#1d212b;--tx:#eef0f6;--mut:#98a1b3;--bd:#272c38;--pr:#8b85ff;--prs:#23244a;--ok:#34d399;--oks:#12332a;--bad:#fb7185;--bads:#3b1823;--sh:0 1px 2px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;padding:0 14px 110px;max-width:1100px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:15px;height:15px}
header.top{display:flex;align-items:center;gap:10px;padding:16px 0 10px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--pr);color:#fff;display:grid;place-items:center}
.top h1{font-size:19px;margin:0;line-height:1.2}.top small{color:var(--mut)}
.seg{display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--sh)}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:10px;color:var(--mut);font-weight:600;transition:.15s}
.seg button.on{background:var(--pr);color:#fff}
.nav{display:flex;align-items:center;gap:8px;margin:14px 0}
.nav .ib{width:40px;height:40px;border-radius:12px;background:var(--sf);border:1px solid var(--bd);display:grid;place-items:center}
.nav{flex-wrap:wrap}.nav .pvb{margin-inline-start:auto}.nav .rng{order:9;flex:1 0 100%;text-align:center;font-weight:700;font-size:16px}
.nav .rng small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.tdy{display:flex;align-items:center;gap:6px;padding:0 14px;height:40px;border-radius:12px;background:var(--prs);color:var(--pr);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.st .l{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
.st b{display:block;font-size:20px;margin-top:4px}
.st.l2 b{color:var(--bad)}.st.l3 b{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.wc{background:var(--sf);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.wh{display:flex;align-items:center;gap:12px;padding:14px}
.av{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
.wn{flex:1;min-width:0}.wn b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12.5px;margin-top:2px}
.ib2{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.ib2:active,.ib2:hover{background:var(--sf2)}
.sum{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mut)}
.pill.l{background:var(--bads);color:var(--bad)}.pill.o{background:var(--oks);color:var(--ok)}.pill.p{background:var(--prs);color:var(--pr)}
.days{border-top:1px solid var(--bd)}
.dr{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border-bottom:1px solid var(--bd);text-align:start;min-height:52px}
.dr:last-child{border-bottom:0}
.dr:active,.dr:hover{background:var(--sf2)}
.dr.td{background:var(--prs)}
.dn{width:74px;flex:none;line-height:1.25}.dn b{display:block;font-size:14px}.dn small{color:var(--mut);font-size:11.5px}
.tms{flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ch{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:9px;font-size:13px;font-weight:600;background:var(--sf2);font-variant-numeric:tabular-nums;direction:ltr}
.ch.in{color:var(--ok)}.ch.out{color:var(--bad)}.ch.no{color:var(--mut);font-weight:400}
.rest{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
.tg{font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:7px}
.tg.l{background:var(--bads);color:var(--bad)}.tg.o{background:var(--oks);color:var(--ok)}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--mut);background:var(--sf);border:1px dashed var(--bd);border-radius:20px}
.empty .i{width:40px;height:40px;margin-bottom:8px;color:var(--pr)}
.fab{position:fixed;inset-inline-start:max(18px,calc(50% - 530px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:19px;background:var(--pr);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(79,70,229,.4);z-index:4}
.fab .i{width:28px;height:28px;stroke-width:2.4}
.clock{background:var(--pr);color:#fff;border-radius:20px;padding:18px;margin:14px 0;text-align:center;box-shadow:var(--sh)}
.clock b{font-size:38px;letter-spacing:1px;font-variant-numeric:tabular-nums;display:block;direction:ltr}
.clock span{opacity:.85;font-size:13px}
.pc{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.pc .wh{padding:0 0 12px}
.stt{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--sf2);color:var(--mut)}
.stt.a{background:var(--oks);color:var(--ok)}.stt.d{background:var(--prs);color:var(--pr)}
.man{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--mut);font-size:12.5px}
.man input{flex:1}
input[type=time],input[type=text]{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--sf2);color:var(--tx);font:inherit}
input:focus{outline:0;border-color:var(--pr)}input.err{border-color:var(--bad)}
.row{display:flex;gap:10px}
.big{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;color:#fff;font-weight:700;font-size:16px}
.big:active{transform:scale(.97)}
.big.in{background:var(--ok)}.big.out{background:var(--bad)}
.pinfo{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.md{position:fixed;inset:0;background:rgba(10,12,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.md.show{display:flex}
.sheet{background:var(--sf);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .2s ease}
@media(min-width:600px){.md{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:17px}
.sheet label{display:block;margin:14px 0 6px;font-size:13px;color:var(--mut);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:11px;background:var(--sf2);border:1.5px solid var(--bd);font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--prs);border-color:var(--pr);color:var(--pr)}
.hint{margin-top:8px;font-size:12.5px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pri{margin-top:18px;width:100%;padding:14px;border-radius:14px;background:var(--pr);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.sec{margin-top:8px;width:100%;padding:12px;border-radius:14px;background:var(--sf2);color:var(--mut);font-weight:600}
.dng{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1d212b;color:#fff;padding:11px 16px;border-radius:13px;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sech{margin:18px 4px 8px;color:var(--mut);font-size:13px;font-weight:600}.sech:first-child{margin-top:14px}
.wk{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:10px;background:var(--sf);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);text-align:start}
.wk:active{background:var(--sf2)}.wk.cur{background:var(--prs);border-color:var(--pr)}
.wk .wi{width:46px;height:46px;border-radius:14px;background:var(--prs);color:var(--pr);display:grid;place-items:center;flex:none}
.wk.cur .wi{background:var(--pr);color:#fff}
.wk .wt{flex:1}.wk .wt b{display:block;font-size:15px}.wk .wt small{color:var(--mut);font-size:12.5px}
@media(max-width:420px){.dn{width:66px}}

.lgw{min-height:85vh;display:grid;place-items:center}
.lgc{width:100%;max-width:380px;background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:24px;box-shadow:var(--sh);text-align:center}
.lgc .logo{margin:0 auto 12px;width:56px;height:56px}
.fld{position:relative;display:flex;align-items:center;margin-top:12px;text-align:start}
.fld>.i{position:absolute;inset-inline-start:15px;color:var(--mut);pointer-events:none}
.fld input{width:100%;height:52px;margin:0;padding:0 46px;border:1.5px solid var(--bd);border-radius:14px;background:var(--sf2);color:var(--tx);font:inherit;font-size:16px;text-align:start;transition:.15s}
.fld input::placeholder{color:var(--mut);opacity:.8}
.fld input:focus{border-color:var(--pr);background:var(--sf);box-shadow:0 0 0 4px var(--prs)}
.fld .eye{position:absolute;inset-inline-end:6px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.fld .eye:active{background:var(--prs);color:var(--pr)}
.lerr small{display:block;color:var(--mut);font-size:11px;margin-top:2px;direction:ltr;word-break:break-word}
.lerr{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
input[type=password],input[type=date]{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--sf2);color:var(--tx);font:inherit}
.sy{margin-inline-start:auto;width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}.sy+.gear{margin-inline-start:12px}
.gear{margin-inline-start:auto;width:42px;height:42px;border-radius:13px;background:var(--sf);border:1px solid var(--bd);display:grid;place-items:center;flex:none}
.wkm{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:start}
.nav .rng{order:0;flex:1;font-size:15px}
[dir=ltr] .chev{transform:scaleX(-1)}

/* mobile form fixes: no auto-zoom, no overlapping inputs */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{overflow-x:hidden}
input,select,textarea{font-size:16px!important;max-width:100%;min-width:0}
input[type=time],input[type=date],input[type=text],input[type=password],input[type=email]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:48px;text-align:start;line-height:1.2}
input[type=time]::-webkit-date-and-time-value,input[type=date]::-webkit-date-and-time-value{text-align:start;margin:0;min-height:1.2em}
.two{gap:12px}.two>div{min-width:0}
.man{flex-wrap:wrap}.man span{flex:1 1 120px;min-width:0}.man input{flex:0 0 140px;width:140px}

.whb{width:100%;text-align:start;background:none}
.chv{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut);flex:none;transition:transform .2s}
.wc.open .chv{transform:rotate(180deg)}
.wc .sum{padding-top:0}
.acts{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--bd)}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:12px;background:var(--sf2);font-weight:600;font-size:14px}
.acts .dng{color:var(--bad)}
.fld input[type=email],.fld input[type=password],.fld input[type=text]{padding-top:0;padding-bottom:0;padding-inline-start:48px;padding-inline-end:52px}

/* ===== animations ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--fc,var(--pr))}100%{box-shadow:0 0 0 18px transparent}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ent>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.ent>*:nth-child(2){animation-delay:.05s}.ent>*:nth-child(3){animation-delay:.1s}.ent>*:nth-child(4){animation-delay:.15s}
.ent>*:nth-child(5){animation-delay:.2s}.ent>*:nth-child(6){animation-delay:.25s}.ent>*:nth-child(7){animation-delay:.3s}.ent>*:nth-child(n+8){animation-delay:.35s}
.lgc{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.lgc .logo{animation:floaty 3.2s ease-in-out infinite}
.lgc.shake{animation:shake .45s}
.md.show{animation:fade .2s ease}
.pc.flash{animation:ring .8s ease-out;--fc:var(--ok)}.pc.flash.fo{--fc:var(--bad)}
.pc.flash .stt{animation:pop .5s}
.pc.flash .pinfo .ch{animation:pop .45s}
.clock{animation:rise .5s both}
.sy.busy{animation:pulse .9s infinite}
button{transition:transform .14s,background-color .2s,opacity .2s}
.pri:active,.sec:active,.chip:active,.seg button:active,.tdy:active,.ib2:active,.fab:active,.gear:active,.acts button:active,.wkm:active{transform:scale(.95)}
.dr:active,.whb:active{transform:scale(.99)}
.chip{transition:transform .14s,background-color .2s,color .2s,border-color .2s}
.seg button{transition:background-color .25s,color .25s,transform .14s}
.wc{transition:box-shadow .25s,transform .25s}.wc.open{box-shadow:0 10px 30px rgba(20,24,40,.14)}
.wc .dd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.wc.open .dd{grid-template-rows:1fr}
.wc .ddi{overflow:hidden;min-height:0;opacity:0;transition:opacity .3s}
.wc.open .ddi{opacity:1}
.chv{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ver{margin-top:12px;color:var(--mut);font-size:11px;opacity:.7}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>

<symbol id="i-in" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-l" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
<symbol id="i-r" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>

<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>

<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
<symbol id="i-ok" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M23 6l-9.5 9.5-5-5L1 18M17 6h6v6"/></symbol>
<symbol id="i-cup" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4ZM6 1v3M10 1v3M14 1v3"/></symbol>
<symbol id="i-sl" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M22 7l-10 7L2 7"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-dn" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
</defs></svg>

<div id="lg" class="lgw"><div class="lgc">
  <div class="logo"><svg class="i"><use href="#i-lock"/></svg></div>
  <h1 data-i="title" style="font-size:19px;margin:0 0 14px"></h1>
  <div class="fld"><svg class="i"><use href="#i-mail"/></svg><input type="email" id="lu" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" data-p="user"></div>
  <div class="fld"><svg class="i"><use href="#i-lock"/></svg><input type="password" id="lp" autocomplete="current-password" data-p="pass"><button type="button" class="eye" data-a="eye"><svg class="i"><use href="#i-eye"/></svg></button></div>
  <div class="lerr" id="le"></div>
  <button class="pri" data-a="login"><svg class="i"><use href="#i-in"/></svg><span data-i="loginBtn"></span></button>
  <div class="seg" id="ll" style="margin-top:14px"><button data-a="lang" data-v="0">العربية</button><button data-a="lang" data-v="1">Français</button><button data-a="lang" data-v="2">English</button></div><div class="ver" id="ver"></div>
</div></div>

<div id="app" style="display:none">
<header class="top">

    var a=get(k,w.id),c=calc(w,a),isr=w.days.indexOf(n.getDay())<0;
    var s=a.out?['sOut','d']:a.in?['sIn','a']:[isr?'sRest':'sNo',''];
    return '<div class="pc'+(flash!=null&&String(flash)==String(w.id)?' flash'+(flashT=='out'?' fo':''):'')+'"><div class="wh">'+av(w)+'<div class="wn"><b>'+esc(w.name)+'</b><div class="meta">'+shiftLbl(w)+'</div></div><span class="stt '+s[1]+'">'+t(s[0])+'</span></div>'+
    '<div class="man">'+ic('edit','s')+'<span>'+t('man')+'</span><input type="time" id="m'+w.id+'" value="'+(ty[w.id]||'')+'"></div>'+
    '<div class="row"><button class="big in" data-a="in" data-id="'+w.id+'">'+ic('in')+t('enter')+'</button><button class="big out" data-a="out" data-id="'+w.id+'">'+ic('out')+t('exit')+'</button></div>'+
    '<div class="pinfo"><span class="ch in">'+ic('in','s')+(a.in||'--:--')+'</span><span class="ch out">'+ic('out','s')+(a.out||'--:--')+'</span>'+tags(c)+'</div></div>';
  }).join('');
  flash=null;
}
function draw(){$('#wl').style.display=view=='list'?'':'none';$('#wv').style.display=view=='week'?'':'none';if(view=='list')drawL();else drawW();drawP()}
function applyL(){
  var h=document.documentElement;h.lang=['ar','fr','en'][li];h.dir=li?'ltr':'rtl';document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i)});
  document.querySelectorAll('[data-p]').forEach(function(e){e.placeholder=t(e.dataset.p)});
  document.querySelectorAll('#ll button').forEach(function(b){b.className=+b.dataset.v==li?'on':''});
  draw();
}
function tick(){var n=new Date();$('#ck').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0')}
setInterval(tick,1000);tick();
function toast(m){var e=$('#ts');e.innerHTML=ic('ok','s')+m;e.className='toast show';clearTimeout(toast.h);toast.h=setTimeout(function(){e.className='toast'},1800)}
function sheet(h){$('#sh').innerHTML=h;$('#md').className='md show'}
function cls(){$('#md').className='md'}
function hd(ti){return '<div class="shh"><b>'+ti+'</b><button class="ib2" data-a="close">'+ic('x')+'</button></div>'}
function W(id){return S.w.filter(function(w){return w.id==id})[0]}
function setT(id,d,k,v){var x=S.a[d]=S.a[d]||{};x[id]=x[id]||{};if(v)x[id][k]=v;else delete x[id][k]}
function enter(){$('#lg').style.display='none';$('#app').style.display='';draw()}
async function login(){
  var em=$('#lu').value.trim(),pw=$('#lp').value;
  if(!em||!pw){$('#le').textContent=t('bad');snd('err');return}
  $('#le').textContent='';
  try{var j=await raw('/auth/v1/token?grant_type=password',{m:'POST',b:{email:em,password:pw}});setSess(j,em);snd('login');enter();entAll();sbLoad()}
  catch(e){snd('err');var lc=document.querySelector('.lgc');if(lc){lc.classList.remove('shake');void lc.offsetWidth;lc.classList.add('shake')}var bd=e.status&&e.status<500;$('#le').innerHTML=esc(t(bd?'bad':'net'))+(bd?'':'<small>'+esc(String(e.message||e))+'</small>')}
}
function wForm(id){
  var w=W(id);fid=w?w.id:null;fSel=w?w.days.slice():[0,1,2,3,4];fSh=w?w.shift:'s';
  sheet(hd(t(w?'editE':'newE'))+'<label>'+t('name')+'</label><input type="text" id="fn" placeholder="'+t('namePh')+'" value="'+esc(w?w.name:'')+'">'+
  '<label>'+t('shift')+'</label><div class="seg"><button data-a="sh" data-v="s" class="'+(fSh=='s'?'on':'')+'">'+ic('sun')+t('morn')+'</button><button data-a="sh" data-v="m" class="'+(fSh=='m'?'on':'')+'">'+ic('moon')+t('eve')+'</button></div>'+
  '<label>'+t('wd')+'</label><div class="chips">'+DNs[li].map(function(n,i){return '<button class="chip'+(fSel.indexOf(i)>=0?' on':'')+'" data-a="tg" data-i="'+i+'">'+n+'</button>'}).join('')+'</div><div class="hint" id="rp"></div>'+
  '<div class="two"><div><label>'+t('tin')+'</label><input type="time" id="fi" value="'+(w?w.in:'08:00')+'"></div><div><label>'+t('tout')+'</label><input type="time" id="fo" value="'+(w?w.out:'16:00')+'"></div></div>'+
  '<button class="pri" data-a="save">'+ic('ok')+t('save')+'</button>');rp();
}
function rp(){$('#rp').textContent=t('rd')+': '+(DNs[li].filter(function(_,i){return fSel.indexOf(i)<0}).join(li?', ':'، ')||t('none'))}
function dForm(id,d){
  var w=W(id),a=get(d,id),dt=new Date(d+'T00:00:00');fid=id;
  sheet(hd(esc(w.name))+'<div class="hint">'+DNs[li][dt.getDay()]+' '+dt.getDate()+' '+MNs[li][dt.getMonth()]+' • '+t('plan')+' '+w.in+' - '+w.out+'</div>'+
  '<div class="two"><div><label>'+t('tin')+'</label><input type="time" id="di" value="'+(a.in||'')+'"></div><div><label>'+t('tout')+'</label><input type="time" id="do" value="'+(a.out||'')+'"></div></div>'+
  '<button class="pri" data-a="dsave" data-d="'+d+'">'+ic('ok')+t('save')+'</button><button class="sec" data-a="dclr" data-d="'+d+'">'+t('clr')+'</button>');
}
function cf(msg,act){sheet(hd(t('del'))+'<div class="hint">'+msg+'</div><button class="pri dng" data-a="'+act+'">'+ic('trash')+t('del')+'</button><button class="sec" data-a="close">'+t('cancel')+'</button>')}
function setF(){
  sheet(hd(t('set'))+'<label>'+t('lang')+'</label><div class="seg">'+['العربية','Français','English'].map(function(n,i){return '<button data-a="lang" data-v="'+i+'" class="'+(i==li?'on':'')+'">'+n+'</button>'}).join('')+'</div>'+
  '<label>'+t('theme')+'</label><div class="seg"><button data-a="thm" data-v="light" class="'+(ct()=='light'?'on':'')+'">'+ic('sun')+t('light')+'</button><button data-a="thm" data-v="dark" class="'+(ct()=='dark'?'on':'')+'">'+ic('moon')+t('dark')+'</button></div>'+
  '<label>'+t('snd')+'</label><div class="seg"><button data-a="snd" data-v="1" class="'+(SND?'on':'')+'">'+t('on')+'</button><button data-a="snd" data-v="0" class="'+(SND?'':'on')+'">'+t('off')+'</button></div>'+'<label>'+t('acc')+'</label><div class="hint" dir="ltr" style="text-align:start">'+esc(SB?SB.email:'')+'</div><input type="password" id="ap" autocomplete="new-password" placeholder="'+t('newP')+'" style="margin-top:8px">'+
  '<button class="pri" data-a="acc">'+ic('ok')+t('save')+'</button><button class="sec" data-a="lo">'+t('logout')+'</button><div class="ver" style="text-align:center">'+VER+'</div>');
}
document.addEventListener('click',async function(ev){
  var b=ev.target.closest('[data-a]');
  if(ev.target.id=='md'){cls();return}
  if(!b)return;var a=b.dataset.a,id=b.dataset.id,d=b.dataset.d;
  ac();var SA={in:'in',out:'out',save:'ok',dsave:'ok',addwk:'ok',acc:'ok',dodel:'del',dowk:'del',dclr:'del',login:'',tw:'',lo:'',snd:''};
  if(a in SA){if(SA[a])snd(SA[a])}else snd('tap');
  if(a=='login')login();
  else if(a=='eye'){var pw0=$('#lp');pw0.type=pw0.type=='password'?'text':'password'}
  else if(a=='lang'){li=+b.dataset.v;ls('plan_lang',['ar','fr','en'][li]);applyL();if($('#md').className.indexOf('show')>=0)setF()}
  else if(a=='thm'){document.documentElement.setAttribute('data-theme',b.dataset.v);ls('plan_theme',b.dataset.v);setF()}
  else if(a=='set')setF();
  else if(a=='acc'){var p=$('#ap').value;if(!p){cls();return}if(p.length<6){toast(t('shortPw'));return}try{await api('/auth/v1/user',{m:'PUT',b:{password:p}});cls();toast(t('saved'))}catch(e){toast(t('net'))}}
  else if(a=='lo'){if(pending()){await sbSync();if(pending()&&!confirm(t('pend')))return}lo()}
  else if(a=='tab'){tab=+b.dataset.v;$('#p1').style.display=tab==1?'':'none';$('#p2').style.display=tab==2?'':'none';$('#t1').className=tab==1?'on':'';$('#t2').className=tab==2?'on':'';draw();entAll();sbLoad()}
  else if(a=='open'){ws=new Date(b.dataset.w+'T00:00:00');view='week';draw();entAll();window.scrollTo(0,0);sbLoad()}
  else if(a=='back'){view='list';draw();entAll();window.scrollTo(0,0)}
  else if(a=='add'){if(tab==1&&view=='list')sheet(hd(t('addWk'))+'<label>'+t('pick')+'</label><input type="date" id="wd" value="'+ymd(new Date())+'"><button class="pri" data-a="addwk">'+ic('ok')+t('save')+'</button>');else wForm()}
  else if(a=='addwk'){var v=$('#wd').value;if(!v)return;var k=ymd(startOf(new Date(v+'T00:00:00')));if(S.weeks.indexOf(k)>=0){toast(t('exists'));return}S.weeks.push(k);save();cls();draw();toast(t('saved'))}
  else if(a=='dwk'){fid=b.dataset.w;cf(t('delWk'),'dowk')}
  else if(a=='dowk'){S.weeks=S.weeks.filter(function(k){return k!=fid});for(var i=0;i<7;i++){var x=new Date(fid+'T00:00:00');x.setDate(x.getDate()+i);delete S.a[ymd(x)]}save();cls();draw()}
  else if(a=='tw'){ow[id]=!ow[id];b.closest('.wc').classList.toggle('open');snd(ow[id]?'open':'close')}
  else if(a=='snd'){SND=b.dataset.v=='1';ls('plan_snd',SND?'1':'0');setF();snd('ok')}
  else if(a=='edit')wForm(id);
  else if(a=='close')cls();
  else if(a=='del'){fid=id;cf(t('delE',{x:esc(W(id).name)}),'dodel')}
  else if(a=='dodel'){S.w=S.w.filter(function(w){return w.id!=fid});Object.keys(S.a).forEach(function(d){delete S.a[d][fid]});save();cls();draw()}
  else if(a=='sh'){fSh=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(function(x){x.className=x==b?'on':''});$('#fi').value=fSh=='s'?'08:00':'16:00';$('#fo').value=fSh=='s'?'16:00':'00:00'}
  else if(a=='tg'){var i2=+b.dataset.i,p2=fSel.indexOf(i2);if(p2<0)fSel.push(i2);else fSel.splice(p2,1);b.classList.toggle('on');rp()}
  else if(a=='save'){
    var n=$('#fn');if(!n.value.trim()){n.className='err';n.focus();return}
    var o={name:n.value.trim(),shift:fSh,days:fSel.slice().sort(),in:$('#fi').value||'08:00',out:$('#fo').value||'16:00'};
    if(fid)S.w=S.w.map(function(w){return w.id==fid?Object.assign({id:fid},o):w});else{o.id=Date.now();S.w.push(o)}
    save();cls();draw();toast(t('saved'))}
  else if(a=='day')dForm(id,d);
  else if(a=='dsave'){setT(fid,d,'in',$('#di').value);setT(fid,d,'out',$('#do').value);fixWeeks();save();cls();draw();toast(t('saved'))}
  else if(a=='dclr'){delete (S.a[d]||{})[fid];save();cls();draw()}
  else if(a=='in'||a=='out'){
    var m=$('#m'+id),n2=new Date(),tt=m.value||String(n2.getHours()).padStart(2,'0')+':'+String(n2.getMinutes()).padStart(2,'0');
    setT(id,ymd(n2),a,tt);fixWeeks();save();m.value='';flash=id;flashT=a;draw();toast(t(a=='in'?'okIn':'okOut')+' '+tt)}
});
$('#lp').addEventListener('keydown',function(e){if(e.key=='Enter')login()});
ws=startOf(new Date());applyL();
['gesturestart','gesturechange','gestureend'].forEach(function(g){document.addEventListener(g,function(e){e.preventDefault()},{passive:false})});
var vv=$('#ver');if(vv)vv.textContent=VER;
if(SB){fixWeeks();enter();entAll();sbLoad()}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&$('#md').className.indexOf('show')<0)sbLoad()});
window.addEventListener('online',function(){sbLoad()});
setInterval(function(){if(!document.hidden&&$('#md').className.indexOf('show')<0)sbLoad()},20000);
</script>
</body>
</html>
